plugins {
    id 'com.android.application'
}

android {
    namespace 'com.udhaarwapas.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.udhaarwapas.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Java sources me Urdu/unicode characters hain — encoding hamesha UTF-8 rakho
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fix: kotlin-stdlib ke purane jdk7/jdk8 tukre duplicate class error dete hain
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
